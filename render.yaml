services:
  - type: web
    name: whatsapp-ai-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PAIRING_NUMBER
        sync: false
      - key: OWNER_NUMBERS
        sync: false
      - key: MONGODB_URI
        sync: false
